<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple v2</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Услубҳои қисми бақайдгирӣ */
        .auth-card { background: #1c2538; border-radius: 14px; padding: 20px; border: 1px solid #2a3b5c; display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .auth-title { font-size: 18px; font-weight: bold; color: #ffc107; margin-bottom: 5px; }
        .auth-input { width: 100%; background: #0f141f; border: 1px solid #2a3b5c; border-radius: 8px; color: white; font-size: 14px; padding: 10px; outline: none; text-align: center; }
        .auth-btn { background: linear-gradient(135deg, #ffc107, #e0a800); color: #0f141f; border: none; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(255,193,7,0.3); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1c2538; padding: 10px 14px; border-radius: 12px; border: 1px solid #2a3b5c; margin-top: 5px; }
        .brand-title { font-size: 14px; font-weight: bold; color: #ffc107; display: flex; align-items: center; gap: 4px; }
        .balance-container { display: flex; align-items: center; gap: 6px; }
        .balance-badge { background: #0f141f; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; color: #22c55e; border: 1px solid #2a3b5c; }
        .top_up_btn { background: #38bdf8; color: #0b0f19; border: none; width: 26px; height: 26px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; }
        
        .game-card { background: #1c2538; border-radius: 14px; padding: 10px; border: 1px solid #2a3b5c; display: flex; flex-direction: column; gap: 5px; max-height: 52vh; overflow-y: auto; }
        
        .row-level { display: flex; align-items: center; justify-content: space-between; background: #0f141f; padding: 4px 8px; border-radius: 8px; border: 1px solid #2a3b5c; transition: 0.2s; }
        .row-mult { font-size: 12px; font-weight: bold; color: #38bdf8; width: 55px; }
        .row-mult.high { color: #ffc107; }
        
        .apples-container { display: flex; gap: 5px; flex: 1; justify-content: center; }
        .apple-box { width: 28px; height: 28px; background: #1c2538; border: 1px solid #2a3b5c; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .apple-box.active { border-color: #ffc107; background: #2a3b5c; box-shadow: 0 0 6px rgba(255,193,7,0.4); }
        .apple-box.win { border-color: #22c55e; background: #064e3b; }
        .apple-box.lose { border-color: #ef4444; background: #7f1d1d; }
        .apple-box.revealed { opacity: 0.7; }

        .card { background: #1c2538; border-radius: 14px; padding: 12px; border: 1px solid #2a3b5c; margin-bottom: 5px; }
        .bet-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .pm-btn { background: #2a3b5c; color: white; border: none; width: 30px; height: 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .bet-input { flex: 1; text-align: center; background: #0f141f; border: 1px solid #2a3b5c; border-radius: 8px; color: white; font-size: 15px; font-weight: bold; padding: 5px; outline: none; }
        
        .quick-amounts { display: flex; gap: 5px; margin-bottom: 8px; }
        .qa-btn { flex: 1; background: #0f141f; border: 1px solid #2a3b5c; color: #94a3b8; padding: 4px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { background: linear-gradient(135deg, #ffc107, #e0a800); color: #0f141f; border: none; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; flex: 2; text-align: center; box-shadow: 0 4px 12px rgba(255,193,7,0.3); }
        .btn-withdraw { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .user-id-info { font-size: 11px; color: #64748b; text-align: center; margin-top: 4px; }
    </style>
</head>

            <input type="text" id="enteredCode" class="auth-input" placeholder="Кодро нависед">
            <button class="auth-btn" onclick="verifyUserCode()">Тасдиқ кардан</button>
        </div>
